<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ease Scrubber Slider Timeline Demo</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="timeline-container">
    
    <div class="control-bar">
      <div class="controls-left">
        <button id="play-pause-btn" class="btn btn-primary" title="Play / Pause Playback">
          <i class="lucide-icon" data-lucide="play"></i>
        </button>
        <button id="reset-btn" class="btn btn-secondary" title="Reset Timeline Pointer">
          <i class="lucide-icon" data-lucide="rotate-ccw"></i>
        </button>
        <div class="time-display">
          <span id="current-time-txt" class="time-highlight">00:00.00</span>
          <span class="time-divider">/</span>
          <span id="duration-txt">00:10.00</span>
        </div>
      </div>

      <div class="easing-selectors">
        <span class="curve-label">
          <i class="lucide-icon" data-lucide="zap"></i> Interpolation:
        </span>
        <button class="ease-btn active" data-ease="easeInOut">Ease In Out</button>
        <button class="ease-btn" data-ease="easeIn">Ease In</button>
        <button class="ease-btn" data-ease="easeOut">Ease Out</button>
        <button class="ease-btn" data-ease="linear">Linear</button>
      </div>
    </div>

    <div class="visual-grid">
      <div class="graph-window">
        <svg id="visualizer-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
          <line x1="0" y1="50" x2="100" y2="50" class="grid-line" stroke-dasharray="2" />
          <line x1="50" y1="0" x2="50" y2="100" class="grid-line" stroke-dasharray="2" />
          
          <path id="curve-path" d="M 0 100 C 30 100 70 0 100 0" />
          
          <circle id="tracer-dot" cx="0" cy="100" r="3" />
        </svg>
        <div class="graph-tag">Velocity Curve Node Plotter</div>
      </div>

      <div class="status-panel">
        <div>
          <div class="panel-label">Eased Translation Value</div>
          <div id="progress-percentage" class="panel-value">0.0%</div>
        </div>
        <div class="progress-track">
          <div id="progress-bar" class="progress-fill"></div>
        </div>
        <div class="panel-footer">
          <span>0.0</span>
          <span>Normalized Value</span>
          <span>1.0</span>
        </div>
      </div>
    </div>

    <div class="timeline-track-wrapper">
      <div id="timeline-scrubber" class="timeline-scrubber-track">
        <div class="track-ticks" id="tick-container"></div>
        
        <div id="playback-progress-overlay" class="progress-overlay"></div>
        
        <div id="eased-marker" class="eased-visual-marker">
          <div class="marker-pulse"></div>
        </div>

        <div id="playhead-handle" class="playhead">
          <div class="playhead-icon">
            <i class="lucide-icon" data-lucide="move" style="width: 10px; height: 10px;"></i>
          </div>
        </div>
      </div>
      
      <div class="track-axis-labels">
        <span>00:00.00</span>
        <span class="instruction-text">Scrub, click or drag the timeline playhead bar</span>
        <span id="total-duration-label">00:10.00</span>
      </div>
    </div>

  </div>

  <script>
    const DURATION = 10;
    const EASING_PRESETS = {
      linear: { func: (t) => t, curve: 'M 0 100 L 100 0' },
      easeIn: { func: (t) => t * t, curve: 'M 0 100 Q 50 100 100 0' },
      easeOut: { func: (t) => t * (2 - t), curve: 'M 0 100 Q 50 0 100 0' },
      easeInOut: { func: (t) => t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t, curve: 'M 0 100 C 30 100 70 0 100 0' }
    };

    let isPlaying = false;
    let currentTime = 0;
    let selectedEase = 'easeInOut';
    let animationFrameId = null;
    let lastTimestamp = null;

    const playPauseBtn = document.getElementById('play-pause-btn');
    const resetBtn = document.getElementById('reset-btn');
    const currentTimeTxt = document.getElementById('current-time-txt');
    const curvePath = document.getElementById('curve-path');
    const tracerDot = document.getElementById('tracer-dot');
    const progressPercentage = document.getElementById('progress-percentage');
    const progressBar = document.getElementById('progress-bar');
    const timelineScrubber = document.getElementById('timeline-scrubber');
    const playbackProgressOverlay = document.getElementById('playback-progress-overlay');
    const easedMarker = document.getElementById('eased-marker');
    const playheadHandle = document.getElementById('playhead-handle');
    const easeButtons = document.querySelectorAll('.ease-btn');
    const tickContainer = document.getElementById('tick-container');

    function generateTrackTicks() {
      tickContainer.innerHTML = '';
      for (let i = 0; i <= 20; i++) {
        const tick = document.createElement('div');
        tick.classList.add('tick', i % 5 === 0 ? 'long' : 'short');
        tickContainer.appendChild(tick);
      }
    }

    function formatTime(time) {
      const mins = Math.floor(time / 60);
      const secs = Math.floor(time % 60);
      const ms = Math.floor((time % 1) * 100);
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}.${ms.toString().padStart(2, '0')}`;
    }

    function updateUI() {
      const rawProgress = currentTime / DURATION;
      const easedProgress = EASING_PRESETS[selectedEase].func(rawProgress);

      currentTimeTxt.textContent = formatTime(currentTime);
      progressPercentage.textContent = `${(easedProgress * 100).toFixed(1)}%`;
      progressBar.style.width = `${easedProgress * 100}%`;
      
      const percentPos = rawProgress * 100;
      playheadHandle.style.left = `${percentPos}%`;
      playbackProgressOverlay.style.width = `${percentPos}%`;
      easedMarker.style.left = `${easedProgress * 100}%`;

      tracerDot.setAttribute('cx', rawProgress * 100);
      tracerDot.setAttribute('cy', 100 - (easedProgress * 100));
    }

    function animate(timestamp) {
      if (lastTimestamp === null) lastTimestamp = timestamp;
      const elapsed = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;

      currentTime += elapsed;
      if (currentTime >= DURATION) {
        currentTime = DURATION;
        isPlaying = false;
        updatePlayPauseState();
      }

      updateUI();
      if (isPlaying) animationFrameId = requestAnimationFrame(animate);
    }

    function updatePlayPauseState() {
      const icon = playPauseBtn.querySelector('i');
      if (isPlaying) {
        icon.setAttribute('data-lucide', 'pause');
        playPauseBtn.classList.replace('btn-primary', 'btn-secondary');
      } else {
        icon.setAttribute('data-lucide', 'play');
        playPauseBtn.classList.replace('btn-secondary', 'btn-primary');
        lastTimestamp = null;
      }
      lucide.createIcons();
    }

    function handleScrub(e) {
      const rect = timelineScrubber.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const percent = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      currentTime = percent * DURATION;
      updateUI();
    }

    playPauseBtn.addEventListener('click', () => {
      if (currentTime >= DURATION) currentTime = 0;
      isPlaying = !isPlaying;
      updatePlayPauseState();
      if (isPlaying) animationFrameId = requestAnimationFrame(animate);
      else cancelAnimationFrame(animationFrameId);
    });

    resetBtn.addEventListener('click', () => {
      isPlaying = false;
      currentTime = 0;
      cancelAnimationFrame(animationFrameId);
      updatePlayPauseState();
      updateUI();
    });

    easeButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelector('.ease-btn.active').classList.remove('active');
        btn.classList.add('active');
        selectedEase = btn.getAttribute('data-ease');
        curvePath.setAttribute('d', EASING_PRESETS[selectedEase].curve);
        updateUI();
      });
    });

    let isDragging = false;
    timelineScrubber.addEventListener('mousedown', (e) => { isDragging = true; handleScrub(e); });
    window.addEventListener('mousemove', (e) => { if (isDragging) handleScrub(e); });
    window.addEventListener('mouseup', () => { isDragging = false; });
    timelineScrubber.addEventListener('touchstart', (e) => { isDragging = true; handleScrub(e); });
    window.addEventListener('touchmove', (e) => { if (isDragging) handleScrub(e); });
    window.addEventListener('touchend', () => { isDragging = false; });

    generateTrackTicks();
    updateUI();
    lucide.createIcons();
  </script>
</body>
</html>
